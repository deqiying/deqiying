name: Sync pinned repositories

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pinned
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test synchronization
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Sync pinned repositories to README
        run: python3 -B .github/scripts/sync_pinned.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README only when changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md
          if git diff --cached --quiet -- README.md; then
            echo "精选项目没有差异，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(profile): 同步 Pinned 精选项目"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
